name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel any in-progress run when a
# new push arrives so we always publish the latest main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        # No `version:` — it's picked from `packageManager` in package.json
        # (pnpm@10.33.4), avoiding ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Univer fork (build + swap package.jsons)
        run: ./scripts/setup-fork.sh

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # apps/web imports `@casualoffice/sheets/xlsx`, whose types
      # resolve through packages/sdk/dist/. tsc + vite both fail with
      # TS2307 'Cannot find module' if the SDK hasn't been built yet.
      - name: Build SDK
        run: pnpm --filter @casualoffice/sheets build

      - name: Typecheck web
        continue-on-error: true
        run: pnpm --filter @sheet/web typecheck

      - name: Build web
        env:
          PAGES_BASE: ${{ github.repository == 'CasualOffice/sheets' && '/' || format('/{0}/', github.event.repository.name) }}
        run: pnpm --filter @sheet/web build

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          mkdir -p public
          cp -R apps/web/dist/. public/
          if [ "${{ github.repository }}" = "CasualOffice/sheets" ]; then
            mkdir -p public/sheets
            echo "sheet.casualoffice.org" > public/CNAME
            cat > public/sheets/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Casual Sheets</title>
              <meta http-equiv="refresh" content="0; url=/" />
              <link rel="canonical" href="https://sheet.casualoffice.org/" />
              <script>location.replace('/');</script>
            </head>
            <body>
              <p>Redirecting to <a href="/">sheet.casualoffice.org</a>…</p>
            </body>
          </html>
          HTML
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
