name: Release CSheets Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
      - 'csheet-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

concurrency:
  group: csheet-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-frontend:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      TURBO_CONCURRENCY: "4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Univer fork (build + swap package.jsons)
        run: ./scripts/setup-fork.sh

      - name: Install pnpm dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @casualoffice/sheets build

      - name: Build web frontend
        env:
          VITE_COOKAPPS_BASE_URL: https://cookapps.net
          VITE_DESKTOP_LEASE_PUBLIC_KEY_BASE64: ${{ secrets.DESKTOP_LEASE_PUBLIC_KEY_BASE64 || 'MCowBQYDK2VwAyEAvSTxJ6EC0pASM2tyZYWRB7MZ7KTw/g3g03FwGPIh+EM=' }}
        run: pnpm --filter @sheet/web build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/web/dist
          if-no-files-found: error

  build-tauri:
    name: Build (${{ matrix.name }})
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: ''
            args: '--bundles nsis'
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles dmg'
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles dmg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/web/dist

      - name: Setup Rust
        if: matrix.rust-target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.rust-target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.0.0' }}
          releaseName: ${{ format('CSheets {0}', inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.0.0') }}
          releaseBody: |
            ## CSheets Desktop Release

            Supported platforms: Windows x64, macOS Apple Silicon (ARM64), macOS Intel (x64).

            ### Installation
            - **Windows**: Run `CSheets-windows-x64-nsis.exe`
            - **macOS**: Open the `.dmg` and drag CSheets to Applications
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: CSheets-[platform]-[arch]-[bundle][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: CSheets-${{ matrix.name }}-[bundle]
