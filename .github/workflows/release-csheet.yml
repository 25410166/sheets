name: Release CSheets Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
      - 'csheet-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

concurrency:
  group: csheet-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build-tauri:
    name: Build (${{ matrix.title }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            title: Windows-x64
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
          - platform: macos-latest
            target: aarch64-apple-darwin
            title: macOS-AppleSilicon
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            title: macOS-Intel
            args: '--target x86_64-apple-darwin --bundles dmg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Univer fork (build + swap package.jsons)
        shell: bash
        run: ./scripts/setup-fork.sh

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK (packages/sdk dist)
        run: pnpm --filter @casualoffice/sheets build

      - name: Typecheck frontend
        run: pnpm --filter @sheet/web typecheck

      - name: Build web frontend
        env:
          VITE_COOKAPPS_BASE_URL: https://cookapps.net
          VITE_DESKTOP_LEASE_PUBLIC_KEY_BASE64: ${{ secrets.DESKTOP_LEASE_PUBLIC_KEY_BASE64 || 'MCowBQYDK2VwAyEAvSTxJ6EC0pASM2tyZYWRB7MZ7KTw/g3g03FwGPIh+EM=' }}
        run: pnpm --filter @sheet/web build

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.0.0' }}
          releaseName: ${{ format('CSheets {0}', inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.0.0') }}
          releaseBody: |
            ## CSheets Desktop Release

            Supported platforms: Windows x64, macOS Intel, macOS Apple Silicon.

            ### Installation
            - **Windows**: Run `CSheets-windows-x64-nsis.exe` setup
            - **macOS**: Open the `.dmg` and drag CSheets to Applications
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          tauriScript: pnpm tauri
          projectPath: .
          releaseAssetNamePattern: CSheets-[platform]-[arch]-[bundle][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: CSheets-${{ matrix.title }}-[bundle]
