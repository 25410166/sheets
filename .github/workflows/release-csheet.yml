name: Release CSheet Desktop

on:
  push:
    tags:
      - 'csheet-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. csheet-v1.0.0)'
        required: true

concurrency:
  group: csheet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            display-name: Windows x64

          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            display-name: macOS Intel

          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            display-name: macOS Apple Silicon

    name: Build ${{ matrix.display-name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── Node + pnpm ───────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ─── Rust ──────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ─── macOS signing setup ────────────────────────────────────────────────
      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Skip if certificate is not configured (non-production builds)
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set. Building unsigned macOS artifact."
            echo "SKIP_SIGNING=true" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "SKIP_SIGNING=false" >> "$GITHUB_ENV"

      # ─── WebView2 (Windows) ─────────────────────────────────────────────────
      - name: Install WebView2 runtime (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-windows-webview2@v0
        continue-on-error: true

      # ─── Dependencies ───────────────────────────────────────────────────────
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      # ─── Type-check + lint ──────────────────────────────────────────────────
      - name: Typecheck frontend
        run: pnpm --filter @sheet/web typecheck

      # ─── Build frontend ─────────────────────────────────────────────────────
      - name: Build web frontend
        env:
          # Production URL for the release build
          VITE_COOKAPPS_BASE_URL: https://cookapps.net
          # Inject the CookApps lease PUBLIC key (never the private key)
          VITE_DESKTOP_LEASE_PUBLIC_KEY_BASE64: ${{ secrets.DESKTOP_LEASE_PUBLIC_KEY_BASE64 }}
        run: pnpm --filter @sheet/web build

      # ─── Build Tauri ────────────────────────────────────────────────────────
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (optional; skip for unsigned builds)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS notarization (optional; skip if not configured)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CSheet ${{ github.ref_name }}'
          releaseBody: |
            ## CSheet Desktop Release

            Supported platforms: Windows x64, macOS Intel, macOS Apple Silicon.

            ### Installation
            - **Windows**: run the `.exe` (NSIS) installer
            - **macOS**: open the `.dmg` and drag CSheet to Applications

            > ⚠️ If this is an unsigned build, you may need to allow the app in System Settings > Privacy & Security.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.rust-target }}
          tauriScript: pnpm tauri
          projectPath: .

      # ─── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csheet-${{ matrix.display-name }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/*.app
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # Verify all three targets succeeded before finalizing the release
  # ──────────────────────────────────────────────────────────────────────────
  release-complete:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release complete
        run: |
          echo "All CSheet platform builds succeeded for tag: ${{ github.ref_name }}"
