name: Release CSheet Desktop

on:
  push:
    tags:
      - 'csheet-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. csheet-v1.0.0)'
        required: true

concurrency:
  group: csheet-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build-tauri:
    name: Build (${{ matrix.title }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            title: Windows-x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            title: macOS-Intel
          - platform: macos-latest
            target: aarch64-apple-darwin
            title: macOS-AppleSilicon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Univer fork (build + swap package.jsons)
        shell: bash
        run: ./scripts/setup-fork.sh

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK (packages/sdk dist)
        run: pnpm --filter @casualoffice/sheets build

      - name: Typecheck frontend
        run: pnpm --filter @sheet/web typecheck

      - name: Build web frontend
        env:
          VITE_COOKAPPS_BASE_URL: https://cookapps.net
          VITE_DESKTOP_LEASE_PUBLIC_KEY_BASE64: ${{ secrets.DESKTOP_LEASE_PUBLIC_KEY_BASE64 }}
        run: pnpm --filter @sheet/web build

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CSheet ${{ github.ref_name }}'
          releaseBody: |
            ## CSheet Desktop Release

            Supported platforms: Windows x64, macOS Intel, macOS Apple Silicon.

            ### Installation
            - **Windows**: run the `.exe` (NSIS) or `.msi` installer
            - **macOS**: open the `.dmg` and drag CSheet to Applications
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          tauriScript: pnpm tauri
          projectPath: .
