<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSheets — CookApps Spreadsheet</title>
    <meta
      name="description"
      content="CSheets – Fast, powerful desktop & web spreadsheet powered by CookApps."
    />
    <meta name="author" content="CookApps" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CSheets" />
    <meta property="og:title" content="CSheets — CookApps Spreadsheet" />
    <meta
      property="og:description"
      content="Fast, powerful desktop & web spreadsheet powered by CookApps."
    />
    <meta property="og:url" content="https://cookapps.net/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CSheets — CookApps Spreadsheet" />
    <meta
      name="twitter:description"
      content="Fast, powerful desktop & web spreadsheet powered by CookApps."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      JSON-LD: SoftwareApplication + Person + WebSite.
      Google's rich-results indexer + LLM crawlers (Perplexity, ChatGPT
      web search, Claude web search) preferentially absorb structured
      data. Keep `softwareVersion`, `featureList`, and `screenshot` fresh.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "@id": "https://sheet.casualoffice.org/#app",
            "name": "CSheets",
            "alternateName": "csheets",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "SpreadsheetApplication",
            "operatingSystem": "Windows, macOS, Web",
            "url": "https://cookapps.net/",
            "softwareVersion": "1.0.0",
            "license": "https://cookapps.net/",
            "description": "Fast, powerful desktop and web spreadsheet powered by CookApps.",
            "author": { "@type": "Organization", "name": "CookApps", "url": "https://cookapps.net/" }
          }
        ]
      }
    </script>

    <!-- Google Fonts (Inter for UI) + Material Symbols Outlined (icons).
         preconnect cuts ~100ms off the first font request. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
